<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tmpx Cloudflare Pages Demo</title>
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>Search</h1>
        <div class="actions">
          <button id="hello" type="button">Quick Hello</button>
        </div>
        <form id="search-form" class="search-form">
          <label for="q">Query</label>
          <input id="q" name="q" type="text" placeholder="Search..." />
          <button type="submit">Submit</button>
        </form>
        <div id="results" class="results">Type to search or submit the form.</div>
      </section>

      <section class="panel">
        <h2>Query Targets</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Category</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>Alpha</td>
              <td>Basic</td>
            </tr>
            <tr>
              <td>2</td>
              <td>Beta</td>
              <td>Basic</td>
            </tr>
            <tr>
              <td>3</td>
              <td>Gamma</td>
              <td>Advanced</td>
            </tr>
            <tr>
              <td>4</td>
              <td>Delta</td>
              <td>Advanced</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section class="panel">
        <h2>tmpx Wasm Preview</h2>
        <div class="preview-grid">
          <textarea id="input" spellcheck="false"></textarea>
          <div id="preview" class="preview" aria-live="polite"></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
